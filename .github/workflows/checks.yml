# Проверки при каждой выкладке и в каждом Pull request: синтаксис, совпадение сайта и базы,
# версия кэша, синхронизация двух устройств на поддельном сервере и вёрстка на телефонах.
# Ничего не меняет ни на сайте, ни в базе. Если что-то упало — отчёт со скриншотами в «Artifacts» запуска.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Быстрые проверки
        run: node tests/check.js
      - name: Проверка типов
        run: npx tsc -p .
      - run: npx playwright install --with-deps chromium
      - name: Тесты в браузере
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
