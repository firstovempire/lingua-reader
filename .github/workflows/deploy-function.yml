# Автодеплой серверной функции перевода в Supabase.
# Срабатывает, когда в main меняется что-то в supabase/functions/.
# Нужен секрет репозитория SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
name: Deploy Supabase function

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy translate
        run: supabase functions deploy translate --project-ref cbxhdemmwxzmksuthzue --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
